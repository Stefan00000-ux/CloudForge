name: "CloudForge CI/CD Pipeline"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Infrastructure Action (Deploy or Destroy)"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
      environment:
        description: "Target Environment"
        required: true
        default: "production"
        type: choice
        options:
          - dev
          - staging
          - production
      server_count:
        description: "Number of EC2 Web Servers"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

jobs:
  devsecops-and-deploy:
    name: "Security Scan & Terraform Provisioning"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Security Scan (Tfsec)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply (Self-Service Provisioning)
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: |
          terraform apply -auto-approve \
            -var="environment=${{ github.event.inputs.environment || 'production' }}" \
            -var="server_count=${{ github.event.inputs.server_count || '2' }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Destroy (Cleanup)
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          terraform destroy -auto-approve \
            -var="environment=${{ github.event.inputs.environment || 'production' }}" \
            -var="server_count=${{ github.event.inputs.server_count || '2' }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}